<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>플루타르코스 비교 열전 아카이브</title>
  
  <!-- 스마트폰 웹앱(PWA) 연동 태그 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e1714">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="플루타르코스">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- 지도 및 관계망 물리 엔진 라이브러리 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <!-- 스타일시트 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="brand">
      <h1>🏛️ 플루타르코스 열전</h1>
      <select class="hero-select" id="heroSelect">
        <option value="theseus">테세우스 (아테네)</option>
        <option value="romulus">로물루스 (로마)</option>
      </select>
    </div>
  </header>

  <!-- 가로 스크롤 메뉴 탭 -->
  <nav class="sub-nav">
    <button class="view-tab-btn active" data-target="overview">🏛️ 개요</button>
    <button class="view-tab-btn" data-target="map">🗺️ 여정 지도</button>
    <button class="view-tab-btn" data-target="quotes">📜 명문장</button>
    <button class="view-tab-btn" data-target="network">🌐 관계망</button>
  </nav>

  <!-- 1. 인물 개요 화면 -->
  <main class="view-panel active" id="overviewPanel">
    <div class="overview-container" id="overviewContent"></div>
  </main>

  <!-- 2. 지도 및 여정 화면 -->
  <main class="view-panel" id="mapViewPanel">
    <div id="map"></div>
    <div class="playback-bar">
      <button class="play-btn" id="playBtn">▶</button>
      <span class="playback-status" id="tourStatus">여정 탐방</span>
    </div>
    <div id="sidebar">
      <div class="sidebar-content" id="placeList"></div>
    </div>
  </main>

  <!-- 3. 명문장 화면 -->
  <main class="view-panel" id="quotesPanel">
    <div class="quotes-container" id="quotesContent"></div>
  </main>

  <!-- 4. 인터랙티브 관계망 화면 -->
  <main class="view-panel" id="graphViewPanel">
    <div class="graph-hud">
      <h2 id="graphHeroTitle">역동적 관계망</h2>
      <p>노드를 터치하여 드래그하거나 세부 정보를 확인하세요.</p>
    </div>
    <svg id="networkSvg"></svg>
    <div class="node-inspector hidden" id="nodeInspector">
      <button class="inspector-close" id="closeInspectorBtn">✕</button>
      <span class="inspector-tag" id="insTag">TYPE</span>
      <div class="inspector-title" id="insTitle">이름</div>
      <div class="inspector-desc" id="insDesc">설명</div>
      <div class="inspector-insight" id="insInsight">플루타르코스의 시선</div>
    </div>
  </main>

  <!-- 데이터 및 기능 스크립트 연결 -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
