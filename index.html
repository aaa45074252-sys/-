<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>플루타르코스 비교 열전 아카이브</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e1714">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-left">
      <h1 id="appTitle">🏛️ 플루타르코스 세계 지도</h1>
    </div>
    
    <div class="header-right">
      <button class="nav-btn active" id="homeMapBtn">🗺️ 전체 지도</button>
      <select class="hero-select" id="heroSelect">
        <option value="" disabled selected>👤 영웅 상세 보기</option>
        <option value="theseus">테세우스 (아테네)</option>
        <option value="romulus">로물루스 (로마)</option>
      </select>
    </div>
  </header>

  <section class="main-view active" id="mapSection">
    <div id="mainMap"></div>
    <div class="map-legend">
      <span class="legend-item"><span class="dot gold"></span> 테세우스 사건</span>
      <span class="legend-item"><span class="dot crimson"></span> 로물루스 사건</span>
    </div>
  </section>

  <section class="main-view" id="heroDetailSection">
    
    <nav class="hero-sub-nav">
      <button class="tab-btn active" data-tab="overview">🏛️ 개요</button>
      <button class="tab-btn" data-tab="network">🌐 관계망</button>
      <button class="tab-btn" data-tab="quotes">📜 중요 문장</button>
      <button class="tab-btn" data-tab="debate">⚖️ 토론장</button>
    </nav>

    <div class="tab-content active" id="tabOverview">
      <div class="content-box" id="overviewBox"></div>
    </div>

    <div class="tab-content" id="tabNetwork">
      <div class="network-wrap">
        <svg id="networkSvg"></svg>
        <div class="node-inspector hidden" id="nodeInspector">
          <button class="close-btn" id="closeInsBtn">✕</button>
          <span class="ins-badge" id="insType">역할</span>
          <h3 id="insName">이름</h3>
          <p id="insDesc">설명</p>
          <div class="ins-insight" id="insInsight">통찰</div>
        </div>
      </div>
    </div>

    <div class="tab-content" id="tabQuotes">
      <div class="content-box" id="quotesBox"></div>
    </div>

    <div class="tab-content" id="tabDebate">
      <div class="content-box">
        
       <div class="debate-form-card">
          <h3 id="debateFormTitle">💬 질문과 답변</h3>
          <p class="form-subtext">자유롭게 생각을 남겨주세요. (수정/삭제용 비밀번호 입력)</p>
          <div class="input-row">
            <input type="text" id="debateAuthor" placeholder="닉네임" maxlength="10">
            <input type="password" id="debatePassword" placeholder="비밀번호(4자리)" maxlength="8">
          </div>
          <textarea id="debateQuestion" placeholder="질문이나 토론하고 싶은 주제를 적어주세요..."></textarea>
          <button class="submit-debate-btn" onclick="addDebatePost()">질문 등록하기</button>
        </div>
        <div id="debateList"></div>

      </div>
    </div>
  </section>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
